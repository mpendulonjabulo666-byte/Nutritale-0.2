<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shopping list</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Playfair+Display:wght@500;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#FAF8F1}
a{color:#174C35}a:hover{color:#0F3624}
@keyframes rise{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes fill{from{width:0}}
.rise{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.row{animation:rise .4s cubic-bezier(.2,.8,.2,1) both;transition:background-color .25s ease,opacity .25s ease}
.bar{transition:width .5s cubic-bezier(.2,.8,.2,1)}
.press{transition:transform .15s ease,background-color .2s ease}
.press:active{transform:scale(.96)}
.check{width:24px;height:24px;accent-color:#174C35;margin:0;flex-shrink:0;cursor:pointer}
.field:focus{border-color:#174C35;box-shadow:0 0 0 3px rgba(23,76,53,.18);outline:none}
a:focus-visible,button:focus-visible,input:focus-visible{outline:3px solid #174C35;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #FAF8F1; color: #202722; font-family: 'DM Sans', system-ui, sans-serif;">
<main style="height: 844px; overflow-y: auto; box-sizing: border-box; padding: 52px 22px 120px; scroll-padding-bottom: 120px;">

  <header class="rise">
    <p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: #5B6A60;">{{countLabel}}</p>
    <h1 style="margin: 4px 0 0; font-family: 'Playfair Display', serif; font-size: 32px; font-weight: 600; color: #174C35;">Shopping list</h1>
    <div role="progressbar" aria-label="Items bought" aria-valuemin="0" aria-valuemax="{{total}}" aria-valuenow="{{boughtCount}}" style="margin-top: 14px; height: 8px; border-radius: 4px; background: #EAF4ED; overflow: hidden;">
      <div class="bar" style="width: {{pct}}; height: 8px; border-radius: 4px; background: #174C35;"></div>
    </div>
  </header>

  <div class="rise" style="margin-top: 18px; display: flex; gap: 8px;">
    <label for="add" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Add an item</label>
    <input class="field" id="add" type="text" value="{{draft}}" onInput="{{onDraft}}" placeholder="Add an item, e.g. lemons" style="flex-grow: 1; min-width: 0; height: 52px; box-sizing: border-box; border-radius: 16px; border: 1.5px solid #5E8A6E; background: #FFFFFF; padding: 0 16px; font-family: 'DM Sans', sans-serif; font-size: 16px; color: #202722;">
    <button class="press" onClick="{{addItem}}" style="height: 52px; padding: 0 18px; border-radius: 16px; border: none; background: #174C35; color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">Add</button>
  </div>
  <p role="status" aria-live="polite" style="margin: 8px 0 0; min-height: 20px; font-size: 14px; font-weight: 600; color: #174C35;">{{status}}</p>

  <sc-for list="{{groups}}" as="g" hint-placeholder-count="3">
    <section style="margin-top: 14px;">
      <h2 style="margin: 0 0 8px; display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 700; color: #5B6A60;">{{g.name}} <span style="font-family: 'Space Grotesk', sans-serif; font-size: 13px;">{{g.count}}</span></h2>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px;">
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="2">
          <li class="row" style="{{i.rowStyle}}">
            <input class="check" type="checkbox" id="{{i.id}}" checked="{{i.checked}}" onChange="{{i.toggle}}">
            <label for="{{i.id}}" style="flex-grow: 1; min-height: 44px; display: flex; flex-direction: column; justify-content: center; cursor: pointer;">
              <span style="{{i.nameStyle}}">{{i.name}}</span>
              <span style="margin-top: 2px; font-size: 13px; color: #5B6A60;">{{i.note}}</span>
            </label>
            <button class="press" onClick="{{i.remove}}" aria-label="{{i.removeLabel}}" style="width: 44px; height: 44px; flex-shrink: 0; border: none; border-radius: 14px; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer;">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#5B6A60" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"></path></svg>
            </button>
          </li>
        </sc-for>
      </ul>
    </section>
  </sc-for>

  <sc-if value="{{allDone}}" hint-placeholder-val="{{ false }}">
    <div class="rise" style="margin-top: 18px; padding: 18px; border-radius: 20px; background: #174C35; color: #FFFFFF; display: flex; align-items: center; gap: 14px;">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#A9CDB6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"></path></svg>
      <div style="flex-grow: 1;">
        <p style="margin: 0; font-size: 16px; font-weight: 700;">All bought</p>
        <p style="margin: 2px 0 0; font-size: 14px; color: #EAF4ED;">Move them into your pantry?</p>
      </div>
      <a class="press" href="Pantry.dc.html" style="min-height: 44px; padding: 0 14px; border-radius: 14px; background: #FFFFFF; color: #174C35; font-size: 15px; font-weight: 700; display: flex; align-items: center; text-decoration: none;">Move</a>
    </div>
  </sc-if>

  <sc-if value="{{isEmpty}}" hint-placeholder-val="{{ false }}">
    <div class="rise" style="margin-top: 18px; padding: 22px; border-radius: 20px; background: #EAF4ED; text-align: center;">
      <p style="margin: 0; font-size: 16px; font-weight: 700; color: #174C35;">Your list is empty</p>
      <p style="margin: 6px 0 14px; font-size: 14px; color: #202722;">Open a recipe and add what you are missing.</p>
      <a href="Home.dc.html" style="font-size: 15px; font-weight: 700; padding: 10px;">Find a recipe</a>
    </div>
  </sc-if>
</main>

<nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 14px; height: 72px; border-radius: 26px; background: #FFFFFF; box-shadow: 0 10px 30px rgba(23,76,53,.16); display: flex; justify-content: space-around; align-items: center; padding: 0 4px;">
  <a href="Home.dc.html" style="min-width: 60px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6A60; font-size: 12px; font-weight: 600;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"></path></svg>Home</a>
  <a href="Pantry.dc.html" style="min-width: 60px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6A60; font-size: 12px; font-weight: 600;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8v3H8z"></path><path d="M7 6h10l1 3v11a1 1 0 0 1-1 1H7a1 1 0 0 1-1-1V9z"></path><path d="M6 12h12"></path></svg>Pantry</a>
  <a href="Search.dc.html" style="min-width: 60px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6A60; font-size: 12px; font-weight: 600;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M15.5 8.5l-2 5-5 2 2-5z"></path></svg>Discover</a>
  <a href="Shopping.dc.html" aria-current="page" style="min-width: 64px; height: 58px; border-radius: 18px; background: #EAF4ED; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #174C35; font-size: 12px; font-weight: 700;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 9h14l-1.5 10.5a1 1 0 0 1-1 .5h-9a1 1 0 0 1-1-.5z"></path><path d="M9 9l3-5 3 5"></path></svg>Shopping</a>
  <a href="Profile.dc.html" style="min-width: 60px; height: 58px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #5B6A60; font-size: 12px; font-weight: 600;">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"></path></svg>Profile</a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const s = this.state || {};
    const items = s.items || [
      { id: 'sh-chia', name: 'Chia seeds', note: 'For Overnight Oats · 1 tbsp', group: 'Pantry staples', bought: false },
      { id: 'sh-berries', name: 'Mixed berries', note: 'For Overnight Oats · 1/2 cup', group: 'Fruit and veg', bought: false },
      { id: 'sh-brinjal', name: 'Brinjal', note: 'From your search', group: 'Fruit and veg', bought: false },
      { id: 'sh-milk', name: 'Milk', note: 'Running low in your pantry', group: 'Dairy and eggs', bought: true }
    ];
    const draft = s.draft || '';
    const save = (next, status) => this.setState({ items: next, status: status || '' });
    const order = ['Fruit and veg', 'Dairy and eggs', 'Pantry staples', 'Other'];
    const groups = order.map((name) => {
      const its = items.filter((i) => i.group === name);
      return {
        name, count: its.filter((i) => !i.bought).length + ' to buy',
        show: its.length > 0,
        items: its.map((i) => ({
          id: i.id, name: i.name, note: i.note, checked: i.bought,
          rowStyle: 'display: flex; align-items: center; gap: 12px; padding: 8px 6px 8px 14px; border-radius: 16px; ' + (i.bought ? 'background: #EAF4ED;' : 'background: #FFFFFF; box-shadow: 0 4px 14px rgba(23,76,53,.06);'),
          nameStyle: 'font-size: 16px; font-weight: 700; ' + (i.bought ? 'text-decoration: line-through; color: #5B6A60;' : 'color: #202722;'),
          toggle: () => save(items.map((x) => x.id === i.id ? Object.assign({}, x, { bought: !x.bought }) : x), i.bought ? i.name + ' moved back to the list.' : i.name + ' marked as bought.'),
          remove: () => save(items.filter((x) => x.id !== i.id), i.name + ' removed.'),
          removeLabel: 'Remove ' + i.name
        }))
      };
    }).filter((g) => g.show);
    const boughtCount = items.filter((i) => i.bought).length;
    const total = items.length;
    return {
      groups, draft, total, boughtCount,
      pct: total ? Math.round(boughtCount / total * 100) + '%' : '0%',
      countLabel: (total - boughtCount) + ' to buy · ' + boughtCount + ' bought',
      status: s.status || '',
      allDone: total > 0 && boughtCount === total,
      isEmpty: total === 0,
      onDraft: (e) => this.setState({ draft: e.target.value }),
      addItem: () => {
        const name = draft.trim();
        if (!name) { this.setState({ status: 'Type an item name first.' }); return; }
        const id = 'sh-' + Date.now();
        this.setState({ items: items.concat([{ id, name: name.charAt(0).toUpperCase() + name.slice(1), note: 'Added by you', group: 'Other', bought: false }]), draft: '', status: name + ' added.' });
      }
    };
  }
}
</script>
</body>
</html>
