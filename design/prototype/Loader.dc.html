<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>NutriTale loading animation</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&amp;family=Playfair+Display:wght@500;600;700&amp;family=Space+Grotesk:wght@500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0;background:#174C35}
a{color:#FFFFFF}a:hover{color:#EAF4ED}
@keyframes flip{0%{transform:scaleX(1)}45%,55%{transform:scaleX(0)}100%{transform:scaleX(-1)}}
@keyframes stem{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes leaf{0%{transform:scale(0) rotate(-30deg);opacity:0}60%{transform:scale(1.1) rotate(4deg);opacity:1}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(-4deg)}}
@keyframes dot{0%,80%,100%{transform:scale(.6);opacity:.4}40%{transform:scale(1);opacity:1}}
@keyframes msg{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.page{transform-box:fill-box;transform-origin:0% 50%;animation:flip 1.6s cubic-bezier(.45,0,.2,1) infinite}
.page2{animation-delay:.8s}
.stem{stroke-dasharray:60;animation:stem .9s ease-out .2s both}
.plant{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.4s ease-in-out 1.2s infinite}
.lf{transform-box:fill-box;transform-origin:0% 100%;animation:leaf .6s cubic-bezier(.2,.8,.2,1) both}
.l1{animation-delay:.8s}.l2{animation-delay:1s;transform-origin:100% 100%}.l3{animation-delay:1.2s}
.dots span{display:inline-block;width:10px;height:10px;border-radius:5px;background:#A9CDB6;margin:0 5px;animation:dot 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.msg{animation:msg .35s ease both}
.press{transition:transform .15s ease}.press:active{transform:scale(.96)}
a:focus-visible,button:focus-visible{outline:3px solid #FFFFFF;outline-offset:3px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}.page{display:none}}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; position: relative; overflow: hidden; background: #174C35; color: #FFFFFF; font-family: 'DM Sans', system-ui, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 28px;">

  <div role="img" aria-label="NutriTale is loading: a recipe book turns its pages while a sprout grows from it" style="width: 240px; height: 200px;">
    <sc-if value="{{show}}" hint-placeholder-val="{{ true }}">
      <svg width="240" height="200" viewBox="0 0 240 200" fill="none" aria-hidden="true">
        <g class="plant">
          <path class="stem" d="M120 150 C120 120 118 96 122 70" stroke="#A9CDB6" stroke-width="4" stroke-linecap="round"></path>
          <path class="lf l1" d="M121 112 C100 108 88 92 90 76 C108 78 120 92 121 112z" fill="#A9CDB6"></path>
          <path class="lf l2" d="M120 96 C140 92 152 78 150 62 C132 64 120 78 120 96z" fill="#EAF4ED"></path>
          <path class="lf l3" d="M122 72 C112 60 112 46 120 36 C130 46 130 60 122 72z" fill="#A9CDB6"></path>
        </g>
        <path d="M30 150 C60 138 95 140 120 152 C145 140 180 138 210 150 L210 176 C180 164 145 166 120 178 C95 166 60 164 30 176z" fill="#0F3624"></path>
        <path d="M36 148 C64 136 96 138 118 150 L118 172 C96 160 64 158 36 170z" fill="#FAF8F1"></path>
        <path d="M122 150 C144 138 176 136 204 148 L204 170 C176 158 144 160 122 172z" fill="#FAF8F1"></path>
        <path d="M50 150 C70 144 90 145 106 151M50 158 C70 152 90 153 106 159M136 151 C152 145 172 144 190 150M136 159 C152 153 172 152 190 158" stroke="#A9CDB6" stroke-width="2" stroke-linecap="round"></path>
        <path class="page" d="M120 150 C140 140 165 139 190 146 L190 166 C165 159 140 160 120 170z" fill="#EAF4ED"></path>
        <path class="page page2" d="M120 150 C140 140 165 139 190 146 L190 166 C165 159 140 160 120 170z" fill="#FFFFFF"></path>
      </svg>
    </sc-if>
  </div>

  <p style="margin: 34px 0 0; font-family: 'Space Grotesk', sans-serif; font-size: 13px; font-weight: 600; letter-spacing: 0.14em; text-transform: uppercase; color: #A9CDB6;">NutriTale</p>
  <p role="status" style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); margin: 0;">Loading recipe ideas</p>
  <p aria-hidden="true" style="margin: 10px 0 0; min-height: 34px; text-align: center; font-family: 'Playfair Display', serif; font-size: 24px; font-weight: 600;">{{message}}</p>
  <div class="dots" aria-hidden="true" style="margin-top: 18px;"><span></span><span></span><span></span></div>

  <div style="position: absolute; left: 28px; right: 28px; bottom: 40px; display: flex; gap: 10px;">
    <button class="press" onClick="{{replay}}" style="flex: 1; min-height: 52px; border-radius: 16px; border: 1.5px solid #A9CDB6; background: transparent; color: #FFFFFF; font-family: 'DM Sans', sans-serif; font-size: 16px; font-weight: 700; cursor: pointer;">Replay</button>
    <a class="press" href="Recipe.dc.html" style="flex: 1; min-height: 52px; border-radius: 16px; background: #FFFFFF; color: #174C35; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Back to recipe</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  componentDidMount() {
    this.timer = setInterval(() => {
      const s = this.state || {};
      this.setState({ step: ((s.step || 0) + 1) % 3 });
    }, 1600);
  }
  componentWillUnmount() { clearInterval(this.timer); }
  renderVals() {
    const s = this.state || {};
    const step = s.step || 0;
    const messages = ['Reading your pantry', 'Matching recipes', 'Plating up ideas'];
    return {
      show: s.hidden ? false : true,
      message: messages[step],
      replay: () => {
        this.setState({ hidden: true, step: 0 });
        setTimeout(() => this.setState({ hidden: false }), 40);
      }
    };
  }
}
</script>
</body>
</html>
